[metadata]
name = clean_dns
version = 0.1.0
description = A command-line tool for managing BIND9 DNS zone files
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.8
install_requires =
    dnspython>=2.0,<2.6; python_version<"3.9"
    dnspython>=2.0; python_version>="3.9"
    PyYAML>=6.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cleandns = cleandns.main:main

[options.extras_require]
dev =
    pytest>=7.0
    pyright>=1.1
build =
    pyinstaller>=6.0
