[project]
name = "clean_dns"
version = "0.1.0"
description = "The purpose of this project is to use Python to manage Domain Name System (DNS) zone files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyright>=1.1",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
cleandns = "cleandns.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"
